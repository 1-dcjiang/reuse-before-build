name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install --upgrade pip ruff==0.12.4 pytest
      - name: Lint
        run: ruff check .
      - name: Offline tests
        run: python -m pytest -q tests
      - name: Contract self-check
        run: python scripts/verify_localized.py SKILL.md --canonical
      - name: Prompt digests
        run: python scripts/prompt_digest.py --verify
