name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install --upgrade pip ruff==0.12.4 pytest==8.4.2
      - name: Lint
        run: ruff check .
      - name: Offline tests
        run: python -m pytest -q tests
      - name: Contract self-check
        run: python scripts/verify_localized.py SKILL.md --canonical
      - name: Prompt digests
        run: python scripts/prompt_digest.py --verify
